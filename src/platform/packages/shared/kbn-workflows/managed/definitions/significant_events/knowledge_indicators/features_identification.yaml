# KI Features Identification Workflow
#
# On-demand workflow that identifies KI features for a single source.
#
# Flow:
#   init → read NightshiftSource.type →
#     entity loop (every type; only logs use diverse sampling)
#   → if(all entity iterations failed) fail
#   → logs: computed features
#   → metrics: catalogue loop
#   → output
#
# Traces and unknown sources stop after the entity loop.
# Computed features and the metrics catalogue do not fail the run.
# The catalogue flag and a METRICS_INFO failure both end the catalogue
# loop with no page, so a non-time-series metrics source does not call the LLM.
#
# Concurrency is keyed per source slug so only one identification run can be
# active for a given source in a space at any time; overlapping triggers are
# dropped. Every request targets the space that runs the workflow.

version: "1"
name: "KI Features Identification"
enabled: true
description: "Identifies KI features in a stream using LLM analysis and computed KI features."
tags:
  - observability
  - streams
  - knowledge-indicators
  - features-identification
settings:
  timeout: "15m"
  concurrency:
    key: "nightshift-source-features-identification-{{ inputs.sourceSlug }}:{{ inputs.sourceId }}"
    strategy: drop
    max: 1
triggers:
  - type: manual
    inputs:
      - name: sourceId
        type: string
        required: true
        description: "Target source id to identify KI features for."
      - name: sourceRevision
        type: string
        required: true
        description: "Source query revision used by this onboarding run."
      - name: sourceSlug
        type: string
        required: true
        description: "Slug of the target source. Together with the source id it keys concurrency."
      - name: start
        type: number
        description: "Start timestamp (epoch ms) for the document sampling window. Defaults to 24 h ago."
      - name: end
        type: number
        description: "End timestamp (epoch ms) for the document sampling window. Defaults to now."
      - name: connectorId
        type: string
        description: "Override connector ID for LLM inference. When omitted, the default connector is resolved."
      - name: maxIterations
        type: number
        default: 5
        description: "Maximum number of LLM sampling iterations."
      - name: convergencePatience
        type: number
        default: 2
        description: "Stop the loop after this many healthy-successful passes without a new feature (degraded iterations are neutral and not counted)."
      - name: sampleSize
        type: number
        description: "Number of documents sampled per iteration."
      - name: featureTtlDays
        type: number
        description: "Number of days before a KI feature expires and is cleaned up."
      - name: entityFilteredRatio
        type: number
        description: "Fraction (0–1) of sample allocated to entity-filtered (must_not) documents."
      - name: diverseRatio
        type: number
        description: "Fraction (0–1) of sample allocated to diverse (unfiltered) documents."
      - name: maxExcludedFeaturesInPrompt
        type: number
        description: "Maximum number of excluded KI features sent in the LLM prompt."
      - name: maxEntityFilters
        type: number
        description: "Maximum number of entity filters applied during sampling."
      - name: maxPreviouslyIdentifiedFeatures
        type: number
        description: "Maximum number of previously identified features sent in the LLM prompt."
steps:
  # -----------------------------------------------------------------------
  # Step 1: Initialize loop variables.
  # -----------------------------------------------------------------------
  - name: init
    type: data.set
    with:
      hasSuccess: false
      totalCompletionTokens: 0
      totalPromptTokens: 0
      totalTokens: 0
      totalCachedTokens: 0
      discoveredFeatures: []
      iterationResults: []
      catalogueIterationResults: []
      catalogueBarrenCount: 0
      connectorId: ""
      barrenCount: 0
      sourceType: ""
      entityDiverseRatio: 0
      computedFeaturesCount: 0
      effectivePatience: "${{ inputs.convergencePatience | at_least: 1 }}"

  # -----------------------------------------------------------------------
  # Step 2: Read the source signal. Entity extraction always runs.
  #         Diverse sampling needs a log message, so every other type
  #         draws a random sample.
  # -----------------------------------------------------------------------
  - name: probe_mode
    type: kibana.request
    with:
      method: POST
      path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/mode"
      headers:
        x-elastic-internal-origin: "kibana"
        x-nightshift-source-revision: "{{ inputs.sourceRevision }}"

  - name: store_mode
    type: data.set
    with:
      sourceType: "${{ steps.probe_mode.output.type }}"

  - name: resolve_diverse_ratio
    type: if
    condition: "${{ variables.sourceType == 'logs' }}"
    steps:
      - name: use_input_diverse_ratio
        type: data.set
        with:
          entityDiverseRatio: "${{ inputs.diverseRatio }}"
    else:
      - name: use_random_sample
        type: data.set
        with:
          entityDiverseRatio: 0

  # -----------------------------------------------------------------------
  # Step 3: Entity extraction. Same agent for every source type.
  #         Only logs use diverse sampling; other types have no message field
  #         to categorize.
  # -----------------------------------------------------------------------
  - name: identify_loop
    type: while
    condition: "${{ variables.iterationResults.size < inputs.maxIterations }}"
    steps:
      - name: prepare
        type: kibana.request
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/inferred/prepare"
          headers:
            x-elastic-internal-origin: "kibana"
            x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
          body:
            start: "${{ inputs.start }}"
            end: "${{ inputs.end }}"
            runId: "${{ execution.id }}"
            iteration: "${{ variables.iterationResults.size | plus: 1 }}"
            sampleSize: "${{ inputs.sampleSize }}"
            entityFilteredRatio: "${{ inputs.entityFilteredRatio }}"
            diverseRatio: "${{ variables.entityDiverseRatio }}"
            maxEntityFilters: "${{ inputs.maxEntityFilters }}"

      - name: check_docs
        type: if
        condition: "steps.prepare.output.hasDocuments:false"
        steps:
          - name: stop_loop
            type: loop.break

      - name: identify_inferred
        type: kibana.request
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/inferred"
          headers:
            x-elastic-internal-origin: "kibana"
            x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
          body:
            connectorId: "${{ inputs.connectorId }}"
            runId: "${{ execution.id }}"
            iteration: "${{ variables.iterationResults.size | plus: 1 }}"
            documents: "${{ steps.prepare.output.documents }}"
            samplingTelemetry: "${{ steps.prepare.output.samplingTelemetry }}"
            maxExcludedFeaturesInPrompt: "${{ inputs.maxExcludedFeaturesInPrompt }}"
            maxPreviouslyIdentifiedFeatures: "${{ inputs.maxPreviouslyIdentifiedFeatures }}"

      - name: update_state
        type: data.set
        with:
          connectorId: "${{ steps.identify_inferred.output.connectorId }}"
          discoveredFeatures: "${{ steps.identify_inferred.output.discoveredFeatures }}"
          iterationResults: "${{ variables.iterationResults | push: steps.identify_inferred.output.iterationResult }}"
          totalCompletionTokens: "${{ variables.totalCompletionTokens | plus: steps.identify_inferred.output.iterationResult.tokensUsed.completion }}"
          totalPromptTokens: "${{ variables.totalPromptTokens | plus: steps.identify_inferred.output.iterationResult.tokensUsed.prompt }}"
          totalTokens: "${{ variables.totalTokens | plus: steps.identify_inferred.output.iterationResult.tokensUsed.total }}"
          totalCachedTokens: "${{ variables.totalCachedTokens | plus: steps.identify_inferred.output.iterationResult.tokensUsed.cached }}"

      - name: mark_success
        type: if
        condition: "${{ steps.identify_inferred.output.iterationResult.state == 'success' }}"
        steps:
          - name: set_success
            type: data.set
            with:
              hasSuccess: true

      - name: track_convergence
        type: if
        condition: "${{ steps.identify_inferred.output.iterationResult.state == 'success' }}"
        steps:
          - name: update_counter
            type: if
            condition: "${{ steps.identify_inferred.output.iterationResult.newFeatures.size > 0 }}"
            steps:
              - name: reset_counter
                type: data.set
                with:
                  barrenCount: 0
            else:
              - name: bump_counter
                type: data.set
                with:
                  barrenCount: "${{ variables.barrenCount | plus: 1 }}"
          - name: maybe_stop
            type: if
            condition: "${{ variables.barrenCount >= variables.effectivePatience }}"
            steps:
              - name: stop_converged
                type: loop.break

  # -----------------------------------------------------------------------
  # Step 4: Fail if entity iterations ran but none succeeded.
  #         Traces and unknown sources end after this check.
  # -----------------------------------------------------------------------
  - name: check_all_failed
    type: if
    condition: "${{ variables.iterationResults.size > 0 and variables.hasSuccess == false }}"
    steps:
      - name: all_failed
        type: workflow.fail
        with:
          message: "All LLM iterations failed for source {{ inputs.sourceId }}"

  # -----------------------------------------------------------------------
  # Step 5: Computed features for logs sources.
  #         Supplementary; failure here should not block the workflow.
  # -----------------------------------------------------------------------
  - name: identify_computed
    type: if
    condition: "${{ variables.sourceType == 'logs' }}"
    steps:
      - name: identify_computed_request
        type: kibana.request
        on-failure:
          retry:
            max-attempts: 3
            delay: "5s"
            strategy: exponential
          continue: true
        with:
          method: POST
          path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/computed"
          headers:
            x-elastic-internal-origin: "kibana"
            x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
          body:
            start: "${{ inputs.start }}"
            end: "${{ inputs.end }}"
            runId: "${{ execution.id }}"
            featureTtlDays: "${{ inputs.featureTtlDays }}"
      - name: store_computed_count
        type: if
        condition: "steps.identify_computed_request.output.computedFeaturesCount:*"
        steps:
          - name: set_computed_count
            type: data.set
            with:
              computedFeaturesCount: "${{ steps.identify_computed_request.output.computedFeaturesCount }}"

  # -----------------------------------------------------------------------
  # Step 6: Metrics catalogue. Separate gather and reason.
  #         A prepare or identify failure ends the loop and does not fail
  #         the run. The prepare route returns no work when the catalogue
  #         flag is off or METRICS_INFO cannot run.
  # -----------------------------------------------------------------------
  - name: catalogue_path
    type: if
    condition: "${{ variables.sourceType == 'metrics' }}"
    steps:
      - name: catalogue_loop
        type: while
        condition: "${{ variables.catalogueIterationResults.size < inputs.maxIterations }}"
        steps:
          - name: catalogue_prepare
            type: kibana.request
            on-failure:
              continue: true
            with:
              method: POST
              path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/metrics/prepare"
              headers:
                x-elastic-internal-origin: "kibana"
                x-nightshift-source-revision: "{{ inputs.sourceRevision }}"

          - name: catalogue_check_work
            type: if
            condition: "steps.catalogue_prepare.output.hasWork:true"
            else:
              - name: catalogue_stop_loop
                type: loop.break
            steps:
              - name: catalogue_identify
                type: kibana.request
                on-failure:
                  continue: true
                with:
                  method: POST
                  path: "/s/{{ workflow.spaceId }}/internal/streams/{{ inputs.sourceId }}/features/_identify/metrics"
                  headers:
                    x-elastic-internal-origin: "kibana"
                    x-nightshift-source-revision: "{{ inputs.sourceRevision }}"
                  body:
                    connectorId: "${{ inputs.connectorId }}"
                    runId: "${{ execution.id }}"
                    iteration: "${{ variables.catalogueIterationResults.size | plus: 1 }}"
                    cataloguePage: "${{ steps.catalogue_prepare.output.cataloguePage }}"
                    maxExcludedFeaturesInPrompt: "${{ inputs.maxExcludedFeaturesInPrompt }}"
                    maxPreviouslyIdentifiedFeatures: "${{ inputs.maxPreviouslyIdentifiedFeatures }}"

              - name: catalogue_check_identified
                type: if
                condition: "steps.catalogue_identify.output.iterationResult:*"
                else:
                  - name: catalogue_stop_on_error
                    type: loop.break
                steps:
                  - name: catalogue_update_state
                    type: data.set
                    with:
                      connectorId: "${{ steps.catalogue_identify.output.connectorId }}"
                      discoveredFeatures: "${{ steps.catalogue_identify.output.discoveredFeatures }}"
                      catalogueIterationResults: "${{ variables.catalogueIterationResults | push: steps.catalogue_identify.output.iterationResult }}"
                      totalCompletionTokens: "${{ variables.totalCompletionTokens | plus: steps.catalogue_identify.output.iterationResult.tokensUsed.completion }}"
                      totalPromptTokens: "${{ variables.totalPromptTokens | plus: steps.catalogue_identify.output.iterationResult.tokensUsed.prompt }}"
                      totalTokens: "${{ variables.totalTokens | plus: steps.catalogue_identify.output.iterationResult.tokensUsed.total }}"
                      totalCachedTokens: "${{ variables.totalCachedTokens | plus: steps.catalogue_identify.output.iterationResult.tokensUsed.cached }}"

                  - name: catalogue_track_convergence
                    type: if
                    condition: "${{ steps.catalogue_identify.output.iterationResult.state == 'success' }}"
                    steps:
                      - name: catalogue_update_counter
                        type: if
                        condition: "${{ steps.catalogue_identify.output.iterationResult.newFeatures.size > 0 }}"
                        steps:
                          - name: catalogue_reset_counter
                            type: data.set
                            with:
                              catalogueBarrenCount: 0
                        else:
                          - name: catalogue_bump_counter
                            type: data.set
                            with:
                              catalogueBarrenCount: "${{ variables.catalogueBarrenCount | plus: 1 }}"
                      - name: catalogue_maybe_stop
                        type: if
                        condition: "${{ variables.catalogueBarrenCount >= variables.effectivePatience }}"
                        steps:
                          - name: catalogue_stop_converged
                            type: loop.break

  # -----------------------------------------------------------------------
  # Step 7: Output results.
  # -----------------------------------------------------------------------
  - name: output_result
    type: workflow.output
    with:
      sourceId: "${{ inputs.sourceId }}"
      connectorId: "${{ variables.connectorId }}"
      discoveredFeatures: "${{ variables.discoveredFeatures }}"
      computedFeaturesCount: "${{ variables.computedFeaturesCount }}"
      tokensUsed:
        completion: "${{ variables.totalCompletionTokens }}"
        prompt: "${{ variables.totalPromptTokens }}"
        total: "${{ variables.totalTokens }}"
        cached: "${{ variables.totalCachedTokens }}"
      iterations: "${{ variables.iterationResults }}"
      catalogueIterations: "${{ variables.catalogueIterationResults }}"
